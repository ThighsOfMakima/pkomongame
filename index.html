<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	
	<title>Пькомони</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@v4.0.0/dist/phaser.min.js"></script>
	<script src="src/main.js" type="module"></script>

	<style>
		body {
			background: #2f2f2f;
			margin: 0;
			padding: 0;
		}
		html, body {
   			overscroll-behavior: none;
		}
		@font-face {
  			font-family: 'uvKits';
  			src: url('assets/uvKits.ttf');
		}
		#screen {
			padding: 2.5vh 1vw 2.5vh 1vw;
			width: 95vw;
			margin: auto;
			background: darkgray;
			height: fit-content;
		}
		canvas {
			max-height: 95vh;
		}
		#game-container {
			text-align: center;
		}
		#controls-mobile {
			height: 30vh;
			display: flex;
		}
		#dpad {
			height: 30vh;
			width: 60vh;
			display: block;
			margin-left: 30px;
			margin-top: 30px;
		}
		#abbuttons {
			height: 30vh;
			width: 40vh;
			margin-top: 30px;
		}

		.dpadbutton {
			width: 75px;
			height: 75px;
			background: white;
			font-size: 50px;
			text-align: center;
			opacity: 0;
		}
		.up {
			margin-left: 75px;
		}
		.down {
			margin-left: 75px;
		}
		.left {
			margin-top: -150px;
		}
		.right {
			padding-top: 10px;
			height: 65px;
			margin-left: 150px;
			}

		#A {
			height: 75px;
			width: 75px;
			background: url('./assets/A.png');
			font-size: 50px;
			text-align: center;
			margin: auto;
			background-size: contain;
		}
		
		#B {
			height: 75px;
			width: 75px;
			background: url('./assets/B.png');
			background-size: contain;
			font-size: 50px;
			text-align: center;
			margin: auto;
			margin-top: 70px;
		}

		#A, #B {
			transition: 0.1s;
		}

		.dpadPic {
			background: url('./assets/dpad.png');
			background-size: contain;
			background-repeat: no-repeat;
			height: 225px;
			width: 27vh;
			position: absolute;
			min-width: 225px;
		}
		#dpad {
    transition: 0.05s;
}

.dpad-left {
    transform:
        translateX(-2px)
        rotate(-1deg);
}

.dpad-right {
    transform:
        translateX(2px)
        rotate(1deg);
}

.dpad-up {
    transform:
        translateY(-2px);
}

.dpad-down {
    transform:
        translateY(2px);
}
	</style>

</head>
	<div id="screen">
		<div id="game-container"></div>
	</div>
	<div id="controls-mobile">
		<div id="dpad">
			<div class = 'dpadPic'></div>
			<div id="up" class="dpadbutton up">▲</div>
			<div id="right" class="dpadbutton right">▶</div>
			<div id="down" class="dpadbutton down">▼</div>
			<div id="left" class="dpadbutton left">◀</div>
		</div>
		<div id="abbuttons">
			<div id="A"></div>
			<div id="B"></div>
		</div>
	</div>
</body>

</html>
